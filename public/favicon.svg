  <path d="M 22 42 L 20 22 L 26 26 L 26 42 Z" fill="url(#goldGrad)" />
  <path d="M 18 28 L 14 30 L 17 38 L 21 38 Z" fill="url(#goldGrad)" />
  <path d="M 20 20 L 15 15 L 18 13 L 23 18 Z" fill="url(#goldGrad)" />

  <!-- Right Wing -->
  <path d="M 42 42 L 44 22 L 38 26 L 38 42 Z" fill="url(#goldGrad)" />
  <path d="M 46 28 L 50 30 L 47 38 L 43 38 Z" fill="url(#goldGrad)" />
